<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Water Polo Live Match Stat-Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* Αποτροπή zoom στο κινητό κατά το γρήγορο πάτημα των κουμπιών */
        button { touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <div class="max-w-4xl mx-auto bg-white min-h-screen shadow-xl">
        <header class="bg-blue-900 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">🤽‍♂️ Live Stat-Tracker</h1>
                <p class="text-xs text-blue-200">Match Report Generator</p>
            </div>
            <button onclick="exportCSV()" class="bg-green-500 hover:bg-green-600 text-white text-sm font-bold py-2 px-4 rounded shadow">
                Download CSV
            </button>
        </header>

        <div class="px-4 pt-4 flex gap-2">
            <button onclick="undoLast()" class="flex-1 bg-slate-200 text-slate-800 active:bg-slate-300 font-semibold py-2 px-3 rounded text-sm border border-slate-300">
                Undo last
            </button>
            <button onclick="newMatch()" class="flex-1 bg-white text-red-700 active:bg-red-50 font-semibold py-2 px-3 rounded text-sm border border-red-300">
                New match
            </button>
        </div>

        <div class="p-4" id="roster-container">
            </div>

        <div class="p-4 bg-slate-50 border-t-2 border-slate-200">
            <h2 class="text-lg font-bold mb-3 text-slate-700">Live Team Stats</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-slate-500">
                    <thead class="text-xs text-slate-700 uppercase bg-slate-200">
                        <tr>
                            <th class="px-3 py-2">Cap</th>
                            <th class="px-3 py-2">Goals/Shots</th>
                            <th class="px-3 py-2">Shot %</th>
                            <th class="px-3 py-2">Steals</th>
                            <th class="px-3 py-2">Excl.</th>
                        </tr>
                    </thead>
                    <tbody id="summary-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Αποθήκευση στο κινητό ώστε να μη χάνονται τα στατιστικά αν κλείσει ή ανανεωθεί η σελίδα
        const STORAGE_KEY = 'wp-tracker-v1';

        function freshPlayers() {
            // 13 παίκτες
            const list = [];
            for (let i = 1; i <= 13; i++) {
                list.push({ cap: i, goals: 0, shots: 0, steals: 0, exclusions: 0 });
            }
            return list;
        }

        function isValidState(s) {
            return s && Array.isArray(s.players) && s.players.length === 13 &&
                s.players.every(p => ['cap', 'goals', 'shots', 'steals', 'exclusions'].every(k => Number.isInteger(p[k]))) &&
                Array.isArray(s.history);
        }

        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (isValidState(saved)) return saved;
            } catch (e) { /* αν η αποθήκευση δεν είναι διαθέσιμη, ξεκινάμε από το μηδέν */ }
            return { players: freshPlayers(), history: [] };
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ players, history }));
            } catch (e) { /* ιδιωτική περιήγηση ή γεμάτος χώρος: συνεχίζουμε χωρίς αποθήκευση */ }
        }

        const state = loadState();
        let players = state.players;
        let history = state.history; // λίστα από {index, type} για το Undo

        // Συνάρτηση για την εμφάνιση των παικτών στην οθόνη
        function renderRoster() {
            const container = document.getElementById('roster-container');
            container.innerHTML = '';

            players.forEach((player, index) => {
                const isGoalie = player.cap === 1 || player.cap === 13;
                
                const card = document.createElement('div');
                card.className = "bg-white border rounded-lg p-3 mb-3 shadow-sm flex flex-col md:flex-row md:items-center justify-between";
                
                card.innerHTML = `
                    <div class="flex items-center mb-2 md:mb-0">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg border-2 ${isGoalie ? 'bg-red-500 text-white border-red-700' : 'bg-blue-100 text-blue-900 border-blue-300'} mr-3">
                            ${player.cap}
                        </div>
                        <div class="font-semibold text-slate-700">Player ${player.cap}</div>
                    </div>
                    <div class="grid grid-cols-4 gap-2 w-full md:w-auto">
                        <button onclick="addStat(${index}, 'goal')" class="bg-green-100 text-green-700 active:bg-green-200 font-semibold py-2 px-1 rounded text-xs border border-green-300">
                            + Goal
                        </button>
                        <button onclick="addStat(${index}, 'shot')" class="bg-yellow-100 text-yellow-700 active:bg-yellow-200 font-semibold py-2 px-1 rounded text-xs border border-yellow-300">
                            + Shot
                        </button>
                        <button onclick="addStat(${index}, 'steal')" class="bg-blue-100 text-blue-700 active:bg-blue-200 font-semibold py-2 px-1 rounded text-xs border border-blue-300">
                            + Steal
                        </button>
                        <button onclick="addStat(${index}, 'exclusion')" class="bg-red-100 text-red-700 active:bg-red-200 font-semibold py-2 px-1 rounded text-xs border border-red-300">
                            + Excl (20s)
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
            
            updateSummaryTable();
        }

        // Συνάρτηση για την προσθήκη στατιστικού
        function addStat(playerIndex, statType) {
            let applied = true;
            if (statType === 'goal') {
                players[playerIndex].goals++;
                players[playerIndex].shots++; // Ένα γκολ μετράει και ως σουτ
            } else if (statType === 'shot') {
                players[playerIndex].shots++;
            } else if (statType === 'steal') {
                players[playerIndex].steals++;
            } else if (statType === 'exclusion') {
                if (players[playerIndex].exclusions < 3) {
                    players[playerIndex].exclusions++;
                } else {
                    applied = false;
                    alert(`Player ${players[playerIndex].cap} already has 3 exclusions! (Fouled out)`);
                }
            }

            if (applied) {
                history.push({ index: playerIndex, type: statType });
                saveState();
            }
            updateSummaryTable();
        }

        // Αναίρεση της τελευταίας καταγραφής (για λάθος πάτημα)
        function undoLast() {
            const last = history.pop();
            if (!last) return;
            const p = players[last.index];
            if (last.type === 'goal') { p.goals--; p.shots--; }
            else if (last.type === 'shot') { p.shots--; }
            else if (last.type === 'steal') { p.steals--; }
            else if (last.type === 'exclusion') { p.exclusions--; }
            saveState();
            updateSummaryTable();
        }

        // Νέος αγώνας: μηδενίζει όλα τα στατιστικά
        function newMatch() {
            if (!confirm('Start a new match? All current stats will be cleared. Download the CSV first if you need it.')) return;
            players = freshPlayers();
            history = [];
            saveState();
            updateSummaryTable();
        }

        // Συνάρτηση για την ανανέωση του πίνακα
        function updateSummaryTable() {
            const tbody = document.getElementById('summary-table-body');
            tbody.innerHTML = '';

            players.forEach(player => {
                // Δεν εμφανίζουμε παίκτες με μηδενικά στατιστικά για να είναι πιο καθαρός ο πίνακας
                if (player.goals === 0 && player.shots === 0 && player.steals === 0 && player.exclusions === 0) return;

                const shotPercentage = player.shots === 0 ? 0 : Math.round((player.goals / player.shots) * 100);
                
                const row = document.createElement('tr');
                row.className = "bg-white border-b";
                
                row.innerHTML = `
                    <td class="px-3 py-2 font-bold text-slate-900">${player.cap}</td>
                    <td class="px-3 py-2">${player.goals} / ${player.shots}</td>
                    <td class="px-3 py-2">${shotPercentage}%</td>
                    <td class="px-3 py-2">${player.steals}</td>
                    <td class="px-3 py-2 text-red-600 font-bold">${player.exclusions > 0 ? player.exclusions : ''}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Συνάρτηση για την εξαγωγή των δεδομένων σε CSV
        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Cap Number,Goals,Total Shots,Shot Percentage,Steals,Exclusions\n";

            players.forEach(player => {
                const shotPercentage = player.shots === 0 ? "0%" : Math.round((player.goals / player.shots) * 100) + "%";
                const row = `${player.cap},${player.goals},${player.shots},${shotPercentage},${player.steals},${player.exclusions}`;
                csvContent += row + "\n";
            });

            // Δημιουργία του link για κατέβασμα
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Match_Report.csv");
            document.body.appendChild(link); // Απαραίτητο για τον Firefox
            
            link.click();
            document.body.removeChild(link);
        }

        // Αρχική εμφάνιση
        renderRoster();
    </script>
</body>
</html>
